set-name: 'PolarFire-SoC-AMP-4Projects'

hart-entry-points: {
  u54_1: '0x80000000',
  u54_2: '0x81000000',
  u54_3: '0x82000000',
  u54_4: '0x83000000'
}

payloads:
  hart1-cli/build/ddr/mpfs-baremetal.elf:
    owner-hart: u54_1
    priv-mode: prv_m
    skip-opensbi: true
    payload-name: "CLI-Master"

  hart2-math/hart2-math.elf:
    owner-hart: u54_2
    priv-mode: prv_m
    skip-opensbi: true
    payload-name: "Math-CRC"

  hart3-memstress/hart3-memstress.elf:
    owner-hart: u54_3
    priv-mode: prv_m
    skip-opensbi: true
    payload-name: "Mem-Stress"

  hart4-watchdog/hart4-watchdog.elf:
    owner-hart: u54_4
    priv-mode: prv_m
    skip-opensbi: true
    payload-name: "Sys-Watchdog"